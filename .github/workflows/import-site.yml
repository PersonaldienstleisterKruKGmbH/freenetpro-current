name: Import uploaded website ZIP

on:
  push:
    paths:
      - '*.zip'

permissions:
  contents: write

jobs:
  import-site:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find and unpack website ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 1 -type f -name '*.zip' -print -quit)"
          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found"
            exit 1
          fi

          TMP_DIR="$(mktemp -d)"
          unzip -q "$ZIP_FILE" -d "$TMP_DIR"

          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name "$(basename "$ZIP_FILE")" \
            -exec rm -rf {} +

          cp -a "$TMP_DIR"/. ./
          rm -f "$ZIP_FILE"

      - name: Commit imported website
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import Freenet Pro website" || exit 0
          git push
